<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1386" height="906" viewBox="0 0 1386 906"
     role="img" aria-labelledby="title description">
  <title id="title">GNU/MOS — XDM login</title>
  <desc id="description">Guest screenshot in a uniform light-gray frame with subtle edge highlights and layered shadows on a transparent background.</desc>
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0"
            width="1386" height="906" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10.6"/>
      <feOffset dx="4.0" dy="12.0"/>
      <feComponentTransfer result="ambient"><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
      <feFlood flood-color="#0f172a"/>
      <feComposite in2="ambient" operator="in"/>
    </filter>
    <filter id="contact-shadow" filterUnits="userSpaceOnUse" x="0" y="0"
            width="1386" height="906" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="4.0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
    </filter>
    <clipPath id="screen">
      <rect x="53" y="53" width="1280" height="800" rx="5"/>
    </clipPath>
  </defs>
  <rect x="48" y="48" width="1290" height="810"
        rx="10" filter="url(#shadow)"/>
  <rect x="48" y="48" width="1290" height="810"
        rx="10" filter="url(#contact-shadow)"/>
  <rect x="48" y="48" width="1290" height="810"
        rx="10" fill="#cbd5e1" stroke="#ffffff" stroke-opacity="0.65"/>
  <image x="53" y="53" width="1280" height="800"
         clip-path="url(#screen)" xlink:href="data:image/png;base64,"/>
  <rect x="53" y="53" width="1280" height="800" rx="5"
        fill="none" stroke="#94a3b8" stroke-opacity="0.55" stroke-width="1.2"/>
</svg>
